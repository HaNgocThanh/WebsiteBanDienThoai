name: phonestore

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    mem_limit: 2560m
    stop_grace_period: 60s
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Create .env and set MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" > /dev/null'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    profiles: [app]
    mem_limit: 512m
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=PhoneStoreDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_keys:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

  web:
    profiles: [app]
    mem_limit: 128m
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  ef:
    profiles: [tools]
    mem_limit: 1536m
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: tooling
    working_dir: /src/PhoneStore.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=PhoneStoreDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
    volumes:
      - ./backend:/src
      - ef_nuget:/root/.nuget/packages
      - /src/PhoneStore.Api/bin
      - /src/PhoneStore.Api/obj
    depends_on:
      db:
        condition: service_healthy

volumes:
  sql_data:
  api_keys:
  ef_nuget:
